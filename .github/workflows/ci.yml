name: C++ and Vulkan build
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev libglfw3-dev glslang-tools libqhull-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile application and tests
        run: cmake --build build --parallel
      - name: Run CPU mesh tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark 100,000-vertex generation and stamps
        run: ./build/mesher_benchmark 100000 65

      - name: Compare remeshing experiment (5000 vertices)
        run: |
          ./build/Mesher --compare-remesh > comparison.csv
          python3 - <<'PY'
          import csv
          with open("comparison.csv") as f:
              lines = f.readlines()
          start = next(i for i,line in enumerate(lines) if line.startswith("mode,stamp,"))
          rows = list(csv.DictReader(lines[start:]))
          for name in ("baseline","collapse"):
              data = [r for r in rows if r["mode"] == name]
              first = lambda condition: next((r["stamp"] for r in data if condition(r)), "never")
              print(f"{name}: {len(data)-1} stamps")
              print(f"  first shrinking edge below limit: {first(lambda r: int(r['shortening_below_limit'])>0)}")
              print(f"  first collapse: {first(lambda r: int(r['removed_vertices'])>0)}")
              print(f"  first inverted triangle: {first(lambda r: int(r['inverted'])>0)}")
              last=data[-1]
              print(f"  final: vertices={last['vertices']}, inverted={last['inverted']}, "
                    f"min_edge={last['min_edge']}, min_altitude={last['min_altitude']}")
          PY

      - name: Four-way curvature/collapse comparison
        run: |
          for gain in 0.5 1.0 2.0; do
            ./build/Mesher --compare-mitigations --curvature-strength "$gain" > "fourway-${gain}.csv"
          done
          python3 - <<'PY'
          import csv
          for gain in ("0.5", "1.0", "2.0"):
              with open(f"fourway-{gain}.csv") as f:
                  lines = f.readlines()
              start = next(i for i, line in enumerate(lines) if line.startswith("mode,stamp,"))
              rows = list(csv.DictReader(lines[start:]))
              print(f"Curvature strength {gain}")
              for mode in ("baseline", "curvature", "collapse", "both"):
                  data = [row for row in rows if row["mode"] == mode]
                  assert len(data) == 106, f"Wrong stamp count: {gain} {mode}"
                  first = next((r["stamp"] for r in data if int(r["inverted"])>0), "never")
                  final = data[-1]
                  if mode == "both" or (mode == "curvature" and gain in ("0.5", "1.0")):
                      assert all(int(r["inverted"]) == 0 for r in data), (gain, mode, "regressed")
                  print(f"  {mode}: first inverted={first}, final inverted={final['inverted']}, "
                        f"vertices={final['vertices']}, min altitude={final['min_altitude']}")
          PY
      - name: Compare local split, flip and collapse (curvature 0.25)
        run: |
          ./build/Mesher --compare-local-remesh --vertices 5000 --curvature-strength 0.25 \
              --max-split-pairs 3 --max-flip-pairs 3 --max-collapse-pairs 3 > local-remesh.csv
          python3 - <<'PY'
          import csv
          with open("local-remesh.csv") as f:
              lines=f.readlines()
          start=next(i for i,line in enumerate(lines) if line.startswith("mode,stamp,"))
          rows=list(csv.DictReader(lines[start:]))
          for mode in ("baseline","collapse","split","split_flip","all"):
              data=[r for r in rows if r["mode"]==mode]
              assert len(data)==106, (mode,len(data))
              added=sum(int(r["added_vertices"]) for r in data)
              flipped=sum(int(r["flip_pairs"]) for r in data)
              removed=sum(int(r["collapsed_vertices"]) for r in data)
              print(f"{mode}: vertices={data[-1]['vertices']}, first inversion="
                    f"{next((r['stamp'] for r in data if int(r['inverted'])>0),'never')}, "
                    f"final inversions={data[-1]['inverted']}, added={added}, "
                    f"flipped={flipped}, removed={removed}")
              if mode in ("split","split_flip","all"):
                  assert added>0, f"Stretch refinement did not trigger: {mode}"
              if mode=="baseline":
                  assert added==0 and flipped==0 and removed==0
          PY
      - name: Save comparison CSV data
        uses: actions/upload-artifact@v4
        with:
          name: mesher-curvature-experiments
          path: |
            comparison.csv
            fourway-*.csv
            local-remesh.csv
